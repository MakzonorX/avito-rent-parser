services:
  parser:
    build: .
    image: avito-rent-parser:latest
    container_name: avito-rent-parser
    restart: unless-stopped
    ports:
      # Наружу порт не открываем — админка доступна только с самого сервера.
      # Чтобы зайти со своего компьютера: ssh -L 9999:localhost:9999 user@server
      # Если админка нужна прямо из интернета, замените на "9999:9999"
      # и обязательно закройте её паролем (например, через nginx с basic auth).
      - "127.0.0.1:9999:9999"
    volumes:
      # Настройки, cookies, найденные объявления и логи переживают перезапуск
      - ./data:/app/data
    environment:
      - TZ=Asia/Yekaterinburg
